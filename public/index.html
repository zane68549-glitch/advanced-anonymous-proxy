<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Search VPN - Safe Browsing</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <h1>🔒 Privacy Search VPN</h1>
                <p class="tagline">Search safely from anywhere</p>
            </div>
        </header>

        <!-- Location Selector -->
        <div class="location-selector">
            <label for="vpn-location">📍 Select Virtual Location:</label>
            <select id="vpn-location">
                <option value="US">🇺🇸 United States</option>
                <option value="UK">🇬🇧 United Kingdom</option>
                <option value="DE">🇩🇪 Germany</option>
                <option value="JP">🇯🇵 Japan</option>
                <option value="AU">🇦🇺 Australia</option>
                <option value="CA">🇨🇦 Canada</option>
                <option value="SG">🇸🇬 Singapore</option>
                <option value="NL">🇳🇱 Netherlands</option>
            </select>
            <button id="connect-btn">Connect</button>
        </div>

        <!-- VPN Status -->
        <div class="vpn-status">
            <div class="status-item">
                <span class="label">Status:</span>
                <span class="value" id="status">Disconnected</span>
            </div>
            <div class="status-item">
                <span class="label">Fake IP:</span>
                <span class="value" id="fake-ip">Not Connected</span>
            </div>
            <div class="status-item">
                <span class="label">Location:</span>
                <span class="value" id="location">Unknown</span>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="search-container">
            <form id="search-form">
                <input 
                    type="text" 
                    id="search-input" 
                    placeholder="Search safely through privacy-focused engines..."
                    autocomplete="off"
                >
                <button type="submit">Search</button>
            </form>
        </div>

        <!-- Loading Spinner -->
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Searching through anonymous networks...</p>
        </div>

        <!-- Results Container (Google-like format) -->
        <div id="results-container" class="results-container">
            <!-- Results will be populated here -->
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>🔐 All searches encrypted • 🌍 Location spoofed • 📡 IP masked</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
